<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <div>
          <p class="text-xs text-slate-500">Simple Store</p>
          <h1 class="text-xl font-bold sm:text-2xl">Shopping Cart</h1>
        </div>
        <div class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white">
          Cart
          <span id="cartCountBadge" class="ml-2 rounded-full bg-white px-2 py-0.5 text-xs text-slate-900">0</span>
        </div>
      </div>
    </header>

    <main class="mx-auto grid max-w-6xl grid-cols-1 gap-6 px-4 py-8 lg:grid-cols-3">
      <section class="lg:col-span-2">
        <h2 class="mb-4 text-2xl font-bold">Products</h2>
        <div id="productGrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
      </section>

      <section class="h-fit rounded-xl border border-slate-200 bg-white p-4">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-lg font-bold">Your Cart</h2>
          <span id="totalItems" class="text-sm text-slate-600">0</span>
        </div>

        <div id="cartItems" class="space-y-3"></div>

        <div class="mt-4 border-t border-slate-200 pt-4">
          <div class="flex items-center justify-between font-semibold">
            <span>Total Price</span>
            <span id="totalPrice">Rs 0.00</span>
          </div>
          <button
            id="checkoutBtn"
            type="button"
            class="mt-4 w-full rounded-md bg-slate-900 py-2.5 text-sm font-semibold text-white hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-400"
          >
            Checkout
          </button>
        </div>
      </section>
    </main>

    <div id="toast" class="pointer-events-none fixed bottom-4 right-4 translate-y-4 opacity-0 transition-all duration-300"></div>

    <script src="js/script.js?v=8"></script>
  </body>
</html>
